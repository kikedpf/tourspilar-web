name: BeLikeTheAlgo - dense evidence module 14 week 20

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-dense-module-14-week-20.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install pillow scenedetect opencv-python-headless
      - name: Download module 14 week 20 only
        run: |
          MEGA_PUBLIC_LINK=$(python - <<'PY'
          import re
          text=open('.github/workflows/belikethealgo-process-module-14-batch-04.yml', encoding='utf-8').read()
          m=re.search(r"MEGA_PUBLIC_LINK:\s*'([^']+)'", text)
          if not m:
              raise SystemExit('MEGA_PUBLIC_LINK not found in validated batch workflow')
          print(m.group(1))
          PY
          )
          export MEGA_PUBLIC_LINK MODULES=14 VIDEO_MIN=20 VIDEO_MAX=20
          node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify exactly one weekly video was selected
        run: |
          count=$(find 'projects/belikethealgo-course-study/work/raw/14) Trades Semanales Explicados' -type f -name '*.mp4' | wc -l)
          echo "Downloaded MP4 count: $count"
          test "$count" -eq 1
      - name: Extract dense visual evidence
        env:
          FRAME_INTERVAL: '2'
          SCENE_THRESHOLD: '0.12'
          MAX_SCENE_CAPTURES: '1200'
        run: |
          video=$(find 'projects/belikethealgo-course-study/work/raw/14) Trades Semanales Explicados' -type f -name '*.mp4' | head -n 1)
          python projects/belikethealgo-course-study/scripts/dense_extract.py "$video" projects/belikethealgo-course-study/dense-week-20
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-020-dense-v1
          path: projects/belikethealgo-course-study/dense-week-20/
          if-no-files-found: error
          retention-days: 3
      - name: Dense extraction marker
        run: echo 'module 14 week 20 dense evidence v1'
