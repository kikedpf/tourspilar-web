name: BeLikeTheAlgo - record Week 18 v2 closure

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-progress-week-18.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
          fetch-depth: 0
      - name: Append Week 18 closure if absent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          text=p.read_text(encoding='utf-8')
          marker='## Week 18 v2 closure'
          if marker not in text:
              text += '''\n\n## Week 18 v2 closure\n\n- Week 18 is **COMPLETE — v2 measurement gate passed**.\n- Full ~29m19s source reviewed chronologically with transcript plus dense visual evidence: 1,759 baseline frames at 1 fps and 3,518 focus frames at 2 fps.\n- Tuesday London provides a clean liquidity -> structure change -> local impulse -> imbalance -> retracement short sequence; the later all-day displacement is L3 and is not used to calibrate the entry impulse.\n- Wednesday NY is a valid/taken long with an ex-ante accumulation concern that later stops; the stop does not create the quality downgrade.\n- Thursday London is rejected because the key manipulation occurs roughly two hours before the valid London operating state.\n- Thursday NY explicitly distinguishes an imbalance with prior liquidity to manipulate from one with no prior liquidity; POI touch alone is insufficient.\n- Friday waits through scheduled news, then accepts a post-news long only after a relevant 4H minimum sweep plus bullish structure/impulse/imbalance confirmation.\n- Direct-vs-confirmed entries and aggressive-vs-conservative stops remain L2 execution variants; no detector threshold is selected from their P&L.\n- Exact OHLC/ATR, spread/slippage, fills, MFE/MAE and several realized-R fields remain unresolved rather than guessed.\n- Detailed v2 record: `study/14-trades-semanales-explicados/018-semana-18.md`.\n- Week 19 is now the next permitted material. Benjamin baseline remains unfrozen until Weeks 1–5 pass v2 backfill.\n'''
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit progress
        run: |
          if git diff --quiet -- projects/belikethealgo-course-study/STUDY_PROGRESS.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git commit -m 'study: update progress through week 18 v2'
          git push origin HEAD:belikethealgo-course-study
