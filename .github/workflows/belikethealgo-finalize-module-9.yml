name: BeLikeTheAlgo - finalize module 9 progress

on:
  push:
    branches:
      - belikethealgo-course-study
    paths:
      - '.github/workflows/belikethealgo-finalize-module-9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout study branch
        uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study

      - name: Update study progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 9) Liquidez del Mercado'
          if marker not in s:
              raise SystemExit('Module 9 marker not found')
          head = s.split(marker, 1)[0].rstrip()
          payload = ''
          tail = base64.b64decode(payload).decode('utf-8')
          p.write_text(head + '\n\n' + tail, encoding='utf-8')
          PY

      - name: Commit progress update
        run: |
          git config user.name "kikedpf"
          git config user.email "kipolan12@hotmail.es"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete BeLikeTheAlgo module 9 Market Liquidity"
          git push origin HEAD:belikethealgo-course-study
