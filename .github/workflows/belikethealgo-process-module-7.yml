name: BeLikeTheAlgo - process module 8 London Killzone

on:
  push:
    branches:
      - belikethealgo-course-study
    paths:
      - '.github/workflows/belikethealgo-process-module-7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout study branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and analysis dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install faster-whisper pillow scenedetect opencv-python-headless

      - name: Download module 8 from MEGA
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '8'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs

      - name: Transcribe and extract visual evidence
        env:
          WHISPER_MODEL: small
          FRAME_INTERVAL: '5'
          SCENE_THRESHOLD: '0.25'
        run: python projects/belikethealgo-course-study/scripts/process_videos.py

      - name: Upload module 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-8-london-killzone-processed-v1
          path: projects/belikethealgo-course-study/processed/
          if-no-files-found: error
          retention-days: 2
