name: BeLikeTheAlgo - update progress Week 7

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-progress-week07.yml']

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
          fetch-depth: 0
      - name: Mark Week 7 complete and Week 8 next
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text()
          start = s.index('### Weeks 7–10 — PROCESSING COMPLETE, ANALYSIS IN PROGRESS')
          end = s.index('- Do not start Weeks 11+ until Weeks 7–10 are fully analyzed and documented', start)
          replacement = "### Week 7 — COMPLETE (v2)\n- Full ~42m18s video reviewed with 377 timestamped transcript segments plus original-source dense visual evidence.\n- Dense evidence gate: 2,313 baseline 1 fps frames + 3,184 focus 2 fps frames generated before contact-sheet consolidation.\n- Setup validity, pre-entry quality and execution mode are kept separate; Benjamin repeatedly contrasts direct imbalance/limit execution with waiting for directional confirmation.\n- Two/three-confirmation language is confluence/quality guidance; illustrative percentages are explicitly invented and are not measured probabilities.\n- Structure is often additive confluence rather than universally mandatory when liquidity/location + impulse/imbalance/candle evidence are strong.\n- Friday losing PDH trade remains an instructor trade; repeated prior sweeps/no reaction plus stronger external liquidity are candidate pre-entry downgrade variables, never a post-loss relabel.\n- Dynamic stop/BE management is again tied to favorable structure/liquidity progress rather than a frozen R threshold.\n- Detailed v2 record: `study/14-trades-semanales-explicados/007-semana-7.md`.\n\n### Weeks 8–10 — PROCESSING COMPLETE, ANALYSIS IN PROGRESS\n- Raw processing and lightweight transcript/navigation evidence exist for Weeks 8–10.\n- Week 8 is the current analysis target; dense 1 fps baseline + 2 fps focus extraction has been launched.\n- Weeks 8–10 must not be marked complete until each passes the v2 completeness gate in order.\n\n### NEXT\n- Complete Week 8 under `ANALYSIS_PROTOCOL.md`, `docs/measurement_architecture_v2.md`, and `docs/weekly_trade_event_schema_v2.md`.\n- Then analyze Weeks 9 and 10 strictly in order.\n"
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git commit -m 'Mark BeLikeTheAlgo Week 7 complete under v2'
          git push origin HEAD:belikethealgo-course-study
