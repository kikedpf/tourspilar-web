name: Inventory unresolved DXY BID windows

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-bid-inventory.yml'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory original BID failures
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: '34700992476'
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.error, urllib.request
          from datetime import date, timedelta

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['ORIGINAL_RUN_ID']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'dxy-bid-inventory',
          }
          transient = {429, 500, 502, 503, 504}
          def get(url):
              for n, delay in enumerate([0,2,5,10,20,30],1):
                  if delay: time.sleep(delay)
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code not in transient or n == 6: raise
                      print(f'retry HTTP {e.code} {n}/6', flush=True)
          jobs=[]; page=1; per=30
          while True:
              batch=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page={per}&page={page}').get('jobs',[])
              jobs.extend(batch)
              if len(batch)<per: break
              page+=1
          pat=re.compile(r'^bid \((\d{4}-\d{2}-\d{2})__(\d{4}-\d{2}-\d{2})\)$')
          failed=[]; days=set()
          for j in jobs:
              m=pat.match(j.get('name',''))
              if m and j.get('conclusion')!='success':
                  a,b=m.groups(); failed.append((a,b,j.get('conclusion'),j.get('id')))
                  d=date.fromisoformat(a); end=date.fromisoformat(b)
                  while d<end:
                      if d.weekday()<5: days.add(d)
                      d+=timedelta(days=1)
          print(f'TOTAL_JOBS={len(jobs)}')
          print(f'FAILED_BID_WINDOWS={len(failed)}')
          print(f'UNIQUE_WEEKDAY_DAYS={len(days)}')
          for a,b,c,jid in failed:
              print(f'FAILED_BID {a}__{b} {c} job={jid}')
          PY
