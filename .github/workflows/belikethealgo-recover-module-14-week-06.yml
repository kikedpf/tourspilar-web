name: BeLikeTheAlgo - resolve module 14 week 6 source gap

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-recover-module-14-week-06.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MEGA reader
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
      - name: Verify module 14 week 6 is absent from source
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '6'
          VIDEO_MAX: '6'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Accept verified source gap instead of failing recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = Path('projects/belikethealgo-course-study/work/raw/_download_summary.json')
          data = json.loads(summary.read_text())
          if data.get('count') != 0:
              raise SystemExit(
                  f"Course source changed: expected Week 6 to be absent, but downloader found {data.get('count')} matching MP4(s)."
              )

          inventory = Path('projects/belikethealgo-course-study/docs/course_inventory.md').read_text()
          if '- Semana 6' not in inventory:
              raise SystemExit('Course inventory no longer records Week 6 as missing.')

          note = Path('projects/belikethealgo-course-study/study/14-trades-semanales-explicados/006-semana-6-no-disponible.md')
          if not note.exists():
              raise SystemExit('Missing explicit Week 6 SOURCE MISSING study record.')

          print('Week 6 verified as SOURCE MISSING. Sequential study may continue with Week 7.')
          PY
      - name: Write workflow summary
        run: |
          {
            echo '## Module 14 Week 6'
            echo ''
            echo '**SOURCE MISSING — verified, not a processing failure.**'
            echo ''
            echo 'Continue sequential analysis with Week 7. Exclude Week 6 from statistical denominators.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolution marker
        run: echo 'week-6 source-gap resolution workflow v3'
