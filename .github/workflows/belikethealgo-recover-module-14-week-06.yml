name: BeLikeTheAlgo - recover module 14 week 6

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-recover-module-14-week-06.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install faster-whisper pillow scenedetect opencv-python-headless
      - name: Download module 14 week 6 only
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '6'
          VIDEO_MAX: '6'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify week 6 was actually selected
        run: |
          python - <<'PY'
          import json
          p='projects/belikethealgo-course-study/work/raw/_download_summary.json'
          d=json.load(open(p))
          if d.get('count') != 1:
              raise SystemExit(f"Expected exactly one week-6 video, downloaded {d.get('count')}")
          print(d)
          PY
      - name: Process week 6 evidence
        env:
          WHISPER_MODEL: small
          FRAME_INTERVAL: '5'
          SCENE_THRESHOLD: '0.25'
        run: python projects/belikethealgo-course-study/scripts/process_videos.py
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-006-processed-v1
          path: projects/belikethealgo-course-study/processed/
          if-no-files-found: error
          retention-days: 2
