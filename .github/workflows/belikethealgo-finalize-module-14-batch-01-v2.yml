name: BeLikeTheAlgo finalize module 14 batch 1 v2

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-finalize-module-14-batch-01-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Update progress marker
        env:
          OLD_B64: IyMgMTQpIFRyYWRlcyBTZW1hbmFsZXMgRXhwbGljYWRvcyDigJQgTkVYVAoKLSBQcm9jZXNzIHdlZWtseS1yZXZpZXcgdmlkZW9zIHN0cmljdGx5IGluIG51bWVyaWMgb3JkZXIsIGluIHNtYWxsIG9yZGVyZWQgYmF0Y2hlcy4KLSBEbyBub3Qgc3RhcnQgbW9kdWxlIDE1IHVudGlsIG1vZHVsZSAxNCBpcyBmdWxseSByZXZpZXdlZC4=
          NEW_B64: 
        run: python -c "import os,base64,pathlib; p=pathlib.Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in s, 'expected module-14 marker not found'; p.write_text(s.replace(old,new))"
      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git commit -m "Update study progress through weekly trades 1-5"
          git push origin HEAD:belikethealgo-course-study
