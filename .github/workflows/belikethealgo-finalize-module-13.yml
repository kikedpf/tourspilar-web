name: BeLikeTheAlgo - finalize module 13 progress

on:
  push:
    branches:
      - belikethealgo-course-study
    paths:
      - '.github/workflows/belikethealgo-finalize-module-13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout study branch
        uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study

      - name: Update study progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 13) BeLikeTheAlgo 2.0 — NEXT'
          if marker not in s:
              raise SystemExit('Module 13 NEXT marker not found')
          head = s.split(marker, 1)[0].rstrip()
          tail = '''## 13) BeLikeTheAlgo 2.0 — MODULE COMPLETE

- All eight videos were reviewed in published order with transcript and visual evidence.
- The module is primarily about funded-account/provider operations rather than new market-entry geometry.
- No new market-entry model replaces modules 1–12.
- Provider-specific rules remain a separate overlay and are excluded from the core market-edge backtest.
- Study record: `study/13-belikethealgo-2-0/README.md`.

## 14) Trades Semanales Explicados — NEXT

- 152 MP4 weekly-review videos are available in the verified course copy.
- Study strictly in numeric order and use this corpus for held-out calibration/validation of liquidity, displacement, structure breaks, confirmations, entries, stops, targets and no-trade decisions.
- Because the module is very large, process it in small ordered batches; never skip ahead or launch module 15 before all available module-14 videos are analyzed.
'''
          p.write_text(head + '\n\n' + tail, encoding='utf-8')
          PY

      - name: Commit progress update
        run: |
          git config user.name "kikedpf"
          git config user.email "kipolan12@hotmail.es"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete BeLikeTheAlgo module 13"
          git push origin HEAD:belikethealgo-course-study
