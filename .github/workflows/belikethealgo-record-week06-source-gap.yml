name: BeLikeTheAlgo - record week 6 source gap in progress

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-record-week06-source-gap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
          fetch-depth: 0
      - name: Update STUDY_PROGRESS sequential state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text()
          old = (
              "### NEXT\n"
              "- Process Weeks 6–10 strictly in order.\n"
              "- Do not start Weeks 11+ until Weeks 6–10 are fully analyzed and documented.\n"
              "- Do not start module 15 until all module-14 weekly videos are fully reviewed.\n"
          )
          new = (
              "### Week 6 — SOURCE MISSING / VERIFIED GAP\n"
              "- The published Module 14 source was checked directly after the batch-02 downloader skipped Week 6.\n"
              "- A dedicated recovery/verification workflow found **zero Week 6 MP4 files** in the MEGA source; this is a source gap, not a processing failure.\n"
              "- Explicit record: `study/14-trades-semanales-explicados/006-semana-6-no-disponible.md`.\n"
              "- `source_gap=true`; `independent_sample=false`; exclude Week 6 from statistical denominators and never fabricate a trade label for it.\n"
              "- Sequential study may therefore continue with the next available published item: Week 7.\n\n"
              "### Weeks 7–10 — PROCESSING COMPLETE, ANALYSIS IN PROGRESS\n"
              "- Raw processing for Weeks 7–10 completed successfully.\n"
              "- A lightweight review artifact preserving transcripts and coarse/state-change visual navigation was generated successfully after fixing its Pillow dependency.\n"
              "- Week 7 is the current analysis target under the v2 measurement architecture.\n"
              "- Dense 1 fps baseline evidence plus 2 fps focus evidence has been launched for Week 7 because 5-second/coarse contact sheets alone do not satisfy the visual-fidelity gate.\n"
              "- Weeks 8–10 must not be marked complete until each passes the same v2 completeness gate in order.\n\n"
              "### NEXT\n"
              "- Complete Week 7 under `ANALYSIS_PROTOCOL.md`, `docs/measurement_architecture_v2.md`, and `docs/weekly_trade_event_schema_v2.md`.\n"
              "- Then analyze Weeks 8, 9 and 10 strictly in order.\n"
              "- Do not start Weeks 11+ until Weeks 7–10 are fully analyzed and documented (Week 6 remains a verified source gap).\n"
              "- Backfill Weeks 1–5 to v2 before freezing the Benjamin baseline.\n"
              "- Do not start module 15 until all available module-14 weekly videos are fully reviewed and all source gaps are explicitly recorded.\n"
          )
          if old not in s:
              if '### Week 6 — SOURCE MISSING / VERIFIED GAP' in s:
                  print('Progress already updated; no change required.')
                  raise SystemExit(0)
              raise SystemExit('Expected NEXT block not found; refusing ambiguous edit.')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit progress update if changed
        run: |
          if git diff --quiet -- projects/belikethealgo-course-study/STUDY_PROGRESS.md; then
            echo 'No progress change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git commit -m 'Document verified Week 6 source gap and Week 7 dense review'
          git push origin HEAD:belikethealgo-course-study
