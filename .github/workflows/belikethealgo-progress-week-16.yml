name: BeLikeTheAlgo - record Week 16 progress

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-progress-week-16.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
          fetch-depth: 0
      - name: Append Week 16 v2 completion if absent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          text=p.read_text()
          marker='### Week 16 — COMPLETE (v2)'
          if marker not in text:
              block='''\n\n### Week 16 — COMPLETE (v2)\n- Full ~40m22s video reviewed chronologically with 362 timestamped transcript segments plus dense full-video visual evidence.\n- Dense evidence gate: 2,422 baseline frames at 1 fps + 4,844 focus frames at 2 fps.\n- Monday NY provides negative evidence that a liquidity sweep plus local impulse is insufficient when confirmation is incomplete and the structure reference would be forced.\n- Tuesday reinforces timing as L0: the early pre-London candidate is skipped/degraded before outcome; Benjamin's historical performance comments remain hypotheses, never P&L-selected detector thresholds.\n- Thursday London cleanly separates quality from result: Benjamin takes an entry he already dislikes because the approach has generated too much liquidity; it later stops, but the stop is not the reason for the pre-entry downgrade.\n- Aggressive/conservative stops, direct/confirmed entries and repeated BE choices are stored as L2 execution/management variants; later outcomes never select L0/L1 thresholds.\n- Friday shows that an Asia-side sweep before London does not permanently invalidate the session: a later in-window setup can still be recognized, so ordered state/event times matter.\n- Exact OHLC/ATR, spread/slippage, MFE/MAE, exact fills, some realized R values and personal execution status for several recognized examples remain unresolved rather than guessed.\n- Detailed v2 record: `study/14-trades-semanales-explicados/016-semana-16.md`.\n\n### NEXT\n- Process and study Week 17 next, strictly before Week 18.\n- Apply `ANALYSIS_PROTOCOL.md`, `docs/measurement_architecture_v2.md`, and `docs/weekly_trade_event_schema_v2.md`.\n- Backfill Weeks 1–5 to v2 before freezing the Benjamin baseline, following `docs/v2_backfill_plan.md`.\n'''
              # Replace previous terminal NEXT section so progress has one current NEXT pointer.
              old='''### NEXT\n- Process and study the next available published weekly item beginning with Week 16, strictly one week at a time after evidence generation.\n- All subsequent weekly examples must use `ANALYSIS_PROTOCOL.md`, `docs/measurement_architecture_v2.md`, and `docs/weekly_trade_event_schema_v2.md`.\n- Backfill Weeks 1–5 to v2 before freezing the Benjamin baseline, following `docs/v2_backfill_plan.md`.'''
              if old in text:
                  text=text.replace(old, block.strip())
              else:
                  text=text.rstrip()+block
              p.write_text(text)
          PY
      - name: Commit progress
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git commit -m 'Mark BeLikeTheAlgo Week 16 complete under v2'
          git push origin HEAD:belikethealgo-course-study
