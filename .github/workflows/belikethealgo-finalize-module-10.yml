name: BeLikeTheAlgo - finalize module 10 progress

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-finalize-module-10.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAIL_B64: 

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Update study progress
        run: python -c "import os,base64; from pathlib import Path; p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md'); s=p.read_text(encoding='utf-8'); m='## 10) Trades de Alta Probabilidad — NEXT'; assert m in s, 'Module 10 NEXT marker not found'; tail=base64.b64decode(os.environ['TAIL_B64']).decode('utf-8'); p.write_text(s.split(m,1)[0].rstrip()+'\n\n'+tail, encoding='utf-8')"
      - name: Commit progress
        run: |
          git config user.name "kikedpf"
          git config user.email "kipolan12@hotmail.es"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete BeLikeTheAlgo module 10 high probability trades"
          git push origin HEAD:belikethealgo-course-study
