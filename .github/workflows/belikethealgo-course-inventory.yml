name: BeLikeTheAlgo - inventory course

on:
  push:
    branches:
      - belikethealgo-course-study
    paths:
      - '.github/workflows/belikethealgo-course-inventory.yml'
      - 'projects/belikethealgo-course-study/scripts/mega_list_course.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout study branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MEGA client
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10

      - name: List full MEGA course tree
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
        run: node projects/belikethealgo-course-study/scripts/mega_list_course.mjs

      - name: Upload course inventory
        uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-course-inventory
          path: projects/belikethealgo-course-study/inventory/
          if-no-files-found: error
          retention-days: 7
