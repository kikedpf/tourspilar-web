name: BeLikeTheAlgo - process module 14 weeks 6-10

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-process-module-14-batch-02.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install faster-whisper pillow scenedetect opencv-python-headless
      - name: Download module 14 weeks 6 through 10
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '6'
          VIDEO_MAX: '10'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Process weekly-trade evidence
        env:
          WHISPER_MODEL: small
          FRAME_INTERVAL: '5'
          SCENE_THRESHOLD: '0.25'
        run: python projects/belikethealgo-course-study/scripts/process_videos.py
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-weeks-006-010-processed-v1
          path: projects/belikethealgo-course-study/processed/
          if-no-files-found: error
          retention-days: 2
