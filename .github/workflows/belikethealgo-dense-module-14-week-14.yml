name: BeLikeTheAlgo - dense evidence module 14 week 14

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-dense-module-14-week-14.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dense-week-14:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Record Week 13 v2 completion in study progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s=p.read_text()
          if '### Week 13 — COMPLETE (v2)' not in s:
              marker='### NEXT\n'
              block='''### Week 13 — COMPLETE (v2)\n- Full ~51m24s video reviewed chronologically with 405 timestamped transcript segments plus dense full-video visual evidence.\n- Dense evidence gate: 3,084 baseline frames at 1 fps + 6,168 focus frames at 2 fps before contact-sheet consolidation.\n- Monday contains a rare instructor self-audit: Benjamin took a trade that ended at BE but, on backtesting, explicitly says it should not have been taken because of pre-entry evidence (late timing, poor candle formation/liquidity-like clustering and distant structure). This is stored as `trade_taken=true` but `setup_validity=invalid`, without using L3 to justify the relabel.\n- Tuesday/Thursday reinforce that a wick liquidity violation is not automatically a structure change; body/force confirmation is separate and no numeric threshold is frozen.\n- Multiple simultaneous 1m imbalances are treated as an ambiguity state; Benjamin suggests reacting only to observed respect or moving to a higher LTF, never hindsight-selecting the best later fill.\n- Tuesday New York cleanly separates good POI/location from bad news-spike executability; execution realism remains an independent L2 gate.\n- Wednesday New York includes a valid setup Benjamin missed live and found in backtesting; it remains `valid + missed_trade`, preserving replication recall rather than selecting only executed trades.\n- Wednesday/Thursday management keeps post-entry accumulation, partials and BE in L2/L3 rather than retroactively changing L0/L1 setup quality.\n- Exact OHLC/ATR, spread/slippage, MFE/MAE and unresolved chart-clock fields remain pending rather than guessed.\n- Detailed v2 record: `study/14-trades-semanales-explicados/013-semana-13.md`.\n\n'''
              if marker not in s:
                  raise SystemExit('NEXT marker not found')
              s=s.replace(marker,block+marker,1)
          s=s.replace('- Process and study the next available published weekly item beginning with Week 13, strictly one week at a time after evidence generation.', '- Process and study the next available published weekly item beginning with Week 14, strictly one week at a time after evidence generation.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record BeLikeTheAlgo week 13 v2 completion'
            git push origin HEAD:belikethealgo-course-study
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MEGA reader and visual dependencies
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless pillow
      - name: Download published Week 14 source video only
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '14'
          VIDEO_MAX: '14'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify exactly one Week 14 MP4 was downloaded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('projects/belikethealgo-course-study/work/raw/_download_summary.json').read_text())
          if data.get('count') != 1:
              raise SystemExit(f"Expected exactly one Week 14 MP4, got {data.get('count')}")
          print(data)
          PY
      - name: Extract dense visual evidence
        run: |
          set -euo pipefail
          ROOT='projects/belikethealgo-course-study'
          VIDEO="$(find "$ROOT/work/raw" -type f -iname '*.mp4' | head -1)"
          test -n "$VIDEO"
          OUT="$ROOT/work/dense/week-14"
          mkdir -p "$OUT"
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/baseline-1fps" --fps 1 --interval 0:7200
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/focus-2fps" --fps 2 --interval 0:7200
          rm -rf "$OUT/baseline-1fps/frames" "$OUT/focus-2fps/frames"
      - name: Write evidence manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('projects/belikethealgo-course-study/work/dense/week-14')
          manifest={
            'week':14,
            'protocol':'ANALYSIS_PROTOCOL.md + measurement_architecture_v2 + weekly_trade_event_schema_v2',
            'baseline':json.loads((root/'baseline-1fps'/'dense_index.json').read_text()),
            'focus':json.loads((root/'focus-2fps'/'dense_index.json').read_text()),
            'note':'Full-video dense passes consolidated into timestamped contact sheets after extraction.'
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('baseline frames:',manifest['baseline']['frame_count'])
          print('focus frames:',manifest['focus']['frame_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-014-dense-evidence-v2
          path: projects/belikethealgo-course-study/work/dense/week-14
          if-no-files-found: error
          retention-days: 2

# registered and triggered by creation on study branch
