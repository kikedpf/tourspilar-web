name: Dukascopy DXY split BID ASK five-year

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-resumable.yml'

concurrency:
  group: dukascopy-dxy-resumable-five-year
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - id: make
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import date, timedelta
          start=date(2021,8,29)
          end=date(2026,8,29)
          step=timedelta(days=10)
          out=[]; cur=start
          while cur < end:
              nxt=min(cur+step,end)
              out.append(f'{cur.isoformat()}__{nxt.isoformat()}')
              cur=nxt
          assert len(out) < 256
          print('matrix='+json.dumps(out,separators=(',',':')))
          PY

  bid:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        window: ${{ fromJson(needs.windows.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Small stagger
        run: sleep 15
      - name: Download and validate DXY BID
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: bid
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY BID or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-bid-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  ask:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        window: ${{ fromJson(needs.windows.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Small stagger
        run: sleep 45
      - name: Download and validate DXY ASK
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: ask
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY ASK or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-ask-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

# BID and ASK now run independently on separate GitHub runners. A failure on one
# side never discards or re-downloads a verified opposite side. Each side is
# Parquet Zstandard + SHA-256 + structural/OHLC validation. Cross-spread checks
# are performed later only when both verified sides for a window exist.
