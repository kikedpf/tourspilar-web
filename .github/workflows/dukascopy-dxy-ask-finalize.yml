name: Finalize verified DXY ASK recovery bundle

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-ask-finalize.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dukascopy-dxy-ask-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, verify and assemble ASK from every recovery attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: '35147734980'
          CANARY_RUN_ID: '35147243657'
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os, re, shutil, time, urllib.error, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          recovery_run = os.environ['RECOVERY_RUN_ID']
          canary_run = os.environ['CANARY_RUN_ID']
          api_headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'dxy-ask-finalizer',
          }
          transient = {429, 500, 502, 503, 504}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect = urllib.request.build_opener(NoRedirect)

          def api_bytes(url):
              delays = [0, 2, 5, 10, 20, 30]
              last = None
              for n, delay in enumerate(delays, 1):
                  if delay:
                      time.sleep(delay)
                  try:
                      req = urllib.request.Request(url, headers=api_headers)
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code not in transient or n == len(delays):
                          raise
                      print(f'API transient HTTP {e.code}; retry {n}/{len(delays)}: {url}', flush=True)
                  except urllib.error.URLError as e:
                      last = e
                      if n == len(delays):
                          raise
                      print(f'API transient URL error; retry {n}/{len(delays)}: {e}', flush=True)
              raise last

          def api_json(url):
              return json.loads(api_bytes(url).decode('utf-8'))

          def list_artifacts(run_id):
              out = []
              page = 1
              while True:
                  data = api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch = data.get('artifacts', [])
                  out.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              print(f'Run {run_id}: {len(out)} artifacts across all attempts', flush=True)
              return out

          def download_artifact(a):
              # GitHub's archive endpoint redirects to an Azure SAS URL. Do not
              # forward the GitHub Authorization header to the Azure host.
              delays = [0, 2, 5, 10, 20, 30]
              last = None
              for n, delay in enumerate(delays, 1):
                  if delay:
                      time.sleep(delay)
                  try:
                      req = urllib.request.Request(a['archive_download_url'], headers=api_headers)
                      location = None
                      try:
                          with no_redirect.open(req, timeout=120) as r:
                              if r.status in (301, 302, 303, 307, 308):
                                  location = r.headers.get('Location')
                              else:
                                  payload = r.read()
                                  location = None
                      except urllib.error.HTTPError as e:
                          if e.code in (301, 302, 303, 307, 308):
                              location = e.headers.get('Location')
                              payload = None
                          else:
                              raise

                      if location:
                          azure_req = urllib.request.Request(location, headers={'User-Agent': 'dxy-ask-finalizer'})
                          with urllib.request.urlopen(azure_req, timeout=180) as r:
                              payload = r.read()

                      digest = a.get('digest', '')
                      if digest.startswith('sha256:'):
                          actual = hashlib.sha256(payload).hexdigest()
                          expected = digest.split(':', 1)[1]
                          if actual != expected:
                              raise RuntimeError(f"GitHub artifact digest mismatch: {a['name']}")
                      return payload
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
                      last = e
                      code = getattr(e, 'code', None)
                      if code is not None and code not in transient and code not in (301, 302, 303, 307, 308):
                          raise
                      if n == len(delays):
                          raise
                      print(f"Artifact transient error for {a['name']}; retry {n}/{len(delays)}: {e}", flush=True)
              raise last

          artifacts = list_artifacts(recovery_run)
          daily_re = re.compile(r'^dukascopy-dxy-ask-daily-(\d{4}-\d{2}-\d{2}__\d{4}-\d{2}-\d{2})$')
          latest = {}
          for a in artifacts:
              m = daily_re.match(a['name'])
              if not m or a.get('expired'):
                  continue
              window = m.group(1)
              if window not in latest or a['created_at'] > latest[window]['created_at']:
                  latest[window] = a

          if len(latest) != 225:
              raise RuntimeError(f'Expected 225 unique verified ASK recovery blocks across attempts, found {len(latest)}')
          print('Recovered ASK success blocks across all attempts: 225', flush=True)

          expected_no_data = {
              '2022-12-26__2022-12-27',
              '2023-01-02__2023-01-03',
          }
          if expected_no_data.intersection(latest):
              raise RuntimeError('A source-empty day unexpectedly exists as a valid market artifact')

          no_data_evidence = []
          for window in sorted(expected_no_data):
              name = f'diagnostics-dxy-ask-daily-{window}'
              candidates = [a for a in artifacts if a['name'] == name and not a.get('expired')]
              if len(candidates) < 1:
                  raise RuntimeError(f'Missing diagnostic evidence for {window}')
              a = max(candidates, key=lambda x: x['created_at'])
              zbytes = download_artifact(a)
              with zipfile.ZipFile(io.BytesIO(zbytes)) as zf:
                  files = [zi for zi in zf.infolist() if not zi.is_dir()]
                  if not files or any(zi.file_size != 0 for zi in files):
                      raise RuntimeError(f'{window} is not confirmed source-empty')
                  no_data_evidence.append({
                      'window': window,
                      'classification': 'source-empty/no market candles',
                      'attempt_count': len(candidates),
                      'diagnostic_artifact_id': a['id'],
                      'diagnostic_sha256': a.get('digest'),
                      'files': [{'name': zi.filename, 'bytes': zi.file_size} for zi in files],
                  })

          canary_artifacts = list_artifacts(canary_run)
          canary_name = 'dukascopy-dxy-ask-json-canary-2022-12-22__2022-12-23'
          canaries = [a for a in canary_artifacts if a['name'] == canary_name and not a.get('expired')]
          if not canaries:
              raise RuntimeError('Missing verified 2022-12-22 ASK canary')

          selected = dict(latest)
          selected['2022-12-22__2022-12-23'] = max(canaries, key=lambda x: x['created_at'])
          if len(selected) != 226:
              raise RuntimeError(f'Expected 226 verified ASK blocks including canary, got {len(selected)}')

          root = Path('ask_bundle')
          shutil.rmtree(root, ignore_errors=True)
          (root / 'daily').mkdir(parents=True)
          verified = []

          for i, (window, a) in enumerate(sorted(selected.items()), 1):
              zbytes = download_artifact(a)
              dest = root / 'daily' / window
              dest.mkdir(parents=True)
              with zipfile.ZipFile(io.BytesIO(zbytes)) as zf:
                  zf.extractall(dest)

              parquets = list(dest.rglob('*.parquet'))
              manifests = list(dest.rglob('manifest_*.json'))
              qualities = list(dest.rglob('quality_*.csv'))
              checksums = list(dest.rglob('checksums_*.csv'))
              if not (len(parquets) == len(manifests) == len(qualities) == len(checksums) == 1):
                  raise RuntimeError(f'Incomplete verified payload for {window}')

              with checksums[0].open(newline='', encoding='utf-8') as fh:
                  checksum_row = next(csv.DictReader(fh))
              pq_sha = hashlib.sha256(parquets[0].read_bytes()).hexdigest()
              if pq_sha != checksum_row['sha256']:
                  raise RuntimeError(f'Parquet SHA-256 mismatch for {window}')

              manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
              if manifest.get('target') != 'DXY' or manifest.get('side') != 'ask' or manifest.get('compression') != 'parquet-zstd':
                  raise RuntimeError(f'Manifest mismatch for {window}')

              with qualities[0].open(newline='', encoding='utf-8') as fh:
                  quality = next(csv.DictReader(fh))
              rows = int(float(quality['rows']))
              duplicates = int(float(quality['duplicates']))
              invalid = int(float(quality['invalid_ohlc']))
              if rows <= 0 or duplicates != 0 or invalid != 0:
                  raise RuntimeError(f'Quality failure in packaged artifact for {window}')

              verified.append({
                  'window': window,
                  'rows': rows,
                  'parquet_sha256': pq_sha,
                  'artifact_id': a['id'],
                  'artifact_sha256': a.get('digest'),
              })
              if i % 25 == 0 or i == len(selected):
                  print(f'Verified {i}/{len(selected)} ASK blocks', flush=True)

          summary = {
              'instrument': 'DXY_DUKASCOPY',
              'side': 'ask',
              'recovery_range': {'start_inclusive': '2022-08-24', 'end_exclusive': '2023-07-10'},
              'verified_daily_blocks': len(verified),
              'total_rows': sum(x['rows'] for x in verified),
              'source_empty_days': no_data_evidence,
              'validation': [
                  'GitHub artifact SHA-256',
                  'Parquet SHA-256 against per-block checksums',
                  'Parquet Zstandard manifest',
                  'rows > 0',
                  'duplicates = 0',
                  'invalid_ohlc = 0',
              ],
              'blocks': verified,
          }
          (root / 'ASK_RECOVERY_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps({
              'verified_daily_blocks': summary['verified_daily_blocks'],
              'total_rows': summary['total_rows'],
              'source_empty_days': summary['source_empty_days'],
          }, indent=2))
          PY

      - name: Package final ASK bundle
        run: |
          tar -czf DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz ask_bundle
          sha256sum DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz > DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          cat DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256

      - name: Upload final verified ASK bundle
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-ask-final-bundle
          path: |
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
