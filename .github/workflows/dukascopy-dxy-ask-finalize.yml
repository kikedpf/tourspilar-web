name: Finalize verified DXY ASK recovery bundle

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-ask-finalize.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dukascopy-dxy-ask-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all verified daily ASK artifacts from recovery run
        uses: actions/download-artifact@v4
        with:
          pattern: dukascopy-dxy-ask-daily-*
          path: ask_recovery_artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35147734980

      - name: Download already verified 2022-12-22 ASK canary
        uses: actions/download-artifact@v4
        with:
          name: dukascopy-dxy-ask-json-canary-2022-12-22__2022-12-23
          path: ask_canary/dukascopy-dxy-ask-json-canary-2022-12-22__2022-12-23
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35147243657

      - name: Independently verify and assemble ASK bundle
        run: |
          python - <<'PY'
          import csv, hashlib, json, re, shutil
          from pathlib import Path

          daily_re = re.compile(r'^dukascopy-dxy-ask-daily-(\d{4}-\d{2}-\d{2}__\d{4}-\d{2}-\d{2})$')
          recovery_root = Path('ask_recovery_artifacts')
          dirs = [p for p in recovery_root.iterdir() if p.is_dir() and daily_re.match(p.name)]
          if len(dirs) != 225:
              raise RuntimeError(f'Expected 225 verified recovery artifacts, found {len(dirs)}')

          selected = []
          for p in dirs:
              selected.append((daily_re.match(p.name).group(1), p))

          canary = Path('ask_canary/dukascopy-dxy-ask-json-canary-2022-12-22__2022-12-23')
          if not canary.exists():
              raise RuntimeError('Missing verified 2022-12-22 canary')
          selected.append(('2022-12-22__2022-12-23', canary))
          if len(selected) != 226:
              raise RuntimeError(f'Expected 226 verified ASK blocks including canary, got {len(selected)}')

          root = Path('ask_bundle')
          shutil.rmtree(root, ignore_errors=True)
          (root / 'daily').mkdir(parents=True)
          verified = []

          for i, (window, src) in enumerate(sorted(selected), 1):
              dest = root / 'daily' / window
              shutil.copytree(src, dest)
              parquets = list(dest.rglob('*.parquet'))
              manifests = list(dest.rglob('manifest_*.json'))
              qualities = list(dest.rglob('quality_*.csv'))
              checksums = list(dest.rglob('checksums_*.csv'))
              if not (len(parquets) == len(manifests) == len(qualities) == len(checksums) == 1):
                  raise RuntimeError(f'Incomplete verified payload for {window}')

              with checksums[0].open(newline='', encoding='utf-8') as fh:
                  checksum_row = next(csv.DictReader(fh))
              pq_sha = hashlib.sha256(parquets[0].read_bytes()).hexdigest()
              if pq_sha != checksum_row['sha256']:
                  raise RuntimeError(f'Parquet SHA-256 mismatch for {window}')

              manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
              if manifest.get('target') != 'DXY' or manifest.get('side') != 'ask' or manifest.get('compression') != 'parquet-zstd':
                  raise RuntimeError(f'Manifest mismatch for {window}')

              with qualities[0].open(newline='', encoding='utf-8') as fh:
                  quality = next(csv.DictReader(fh))
              rows = int(float(quality['rows']))
              duplicates = int(float(quality['duplicates']))
              invalid = int(float(quality['invalid_ohlc']))
              if rows <= 0 or duplicates != 0 or invalid != 0:
                  raise RuntimeError(f'Quality failure in packaged artifact for {window}')

              verified.append({'window': window, 'rows': rows, 'parquet_sha256': pq_sha})
              if i % 25 == 0 or i == len(selected):
                  print(f'Verified {i}/{len(selected)} ASK blocks', flush=True)

          no_data = [
              {
                  'window': '2022-12-26__2022-12-27',
                  'classification': 'source-empty/no market candles',
                  'evidence': '11 recovery attempts; latest diagnostic CSV independently inspected as 0 bytes',
              },
              {
                  'window': '2023-01-02__2023-01-03',
                  'classification': 'source-empty/no market candles',
                  'evidence': '11 recovery attempts; latest diagnostic CSV independently inspected as 0 bytes',
              },
          ]
          summary = {
              'instrument': 'DXY_DUKASCOPY',
              'side': 'ask',
              'recovery_range': {'start_inclusive': '2022-08-24', 'end_exclusive': '2023-07-10'},
              'verified_daily_blocks': len(verified),
              'total_rows': sum(x['rows'] for x in verified),
              'source_empty_days': no_data,
              'validation': [
                  'Parquet SHA-256 against per-block checksums',
                  'Parquet Zstandard manifest',
                  'rows > 0',
                  'duplicates = 0',
                  'invalid_ohlc = 0',
              ],
              'blocks': verified,
          }
          (root / 'ASK_RECOVERY_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps({
              'verified_daily_blocks': summary['verified_daily_blocks'],
              'total_rows': summary['total_rows'],
              'source_empty_days': summary['source_empty_days'],
          }, indent=2))
          PY

      - name: Package final ASK bundle
        run: |
          tar -czf DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz ask_bundle
          sha256sum DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz > DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          cat DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256

      - name: Upload final verified ASK bundle
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-ask-final-bundle
          path: |
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
