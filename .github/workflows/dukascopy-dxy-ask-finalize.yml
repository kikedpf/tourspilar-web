name: Finalize verified DXY ASK recovery bundle

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-ask-finalize.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dukascopy-dxy-ask-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and independently verify ASK bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: '35147734980'
          CANARY_RUN_ID: '35147243657'
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os, re, shutil, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          recovery_run = os.environ['RECOVERY_RUN_ID']
          canary_run = os.environ['CANARY_RUN_ID']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'dxy-ask-finalizer',
          }

          def request_bytes(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          def request_json(url):
              return json.loads(request_bytes(url).decode('utf-8'))

          def list_artifacts(run_id):
              out = []
              page = 1
              while True:
                  data = request_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch = data.get('artifacts', [])
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          artifacts = list_artifacts(recovery_run)
          daily_re = re.compile(r'^dukascopy-dxy-ask-daily-(\d{4}-\d{2}-\d{2}__\d{4}-\d{2}-\d{2})$')
          latest = {}
          for a in artifacts:
              m = daily_re.match(a['name'])
              if not m or a.get('expired'):
                  continue
              window = m.group(1)
              if window not in latest or a['created_at'] > latest[window]['created_at']:
                  latest[window] = a

          # The recovery matrix had 227 weekday jobs, excluding the previously
          # verified 2022-12-22 canary. Two source-empty observed holidays remain.
          expected_no_data = {
              '2022-12-26__2022-12-27',
              '2023-01-02__2023-01-03',
          }
          if len(latest) != 225:
              raise RuntimeError(f'Expected 225 verified daily ASK artifacts, found {len(latest)}')
          if expected_no_data.intersection(latest):
              raise RuntimeError('A source-empty holiday unexpectedly appeared as valid market data')

          # Verify the two no-data cases independently from their latest diagnostic ZIPs.
          no_data_evidence = []
          for window in sorted(expected_no_data):
              name = f'diagnostics-dxy-ask-daily-{window}'
              candidates = [a for a in artifacts if a['name'] == name and not a.get('expired')]
              if not candidates:
                  raise RuntimeError(f'Missing diagnostic evidence for {window}')
              a = max(candidates, key=lambda x: x['created_at'])
              zbytes = request_bytes(a['archive_download_url'])
              digest = a.get('digest', '')
              if digest.startswith('sha256:') and hashlib.sha256(zbytes).hexdigest() != digest.split(':', 1)[1]:
                  raise RuntimeError(f'Diagnostic artifact digest mismatch for {window}')
              with zipfile.ZipFile(io.BytesIO(zbytes)) as zf:
                  files = [zi for zi in zf.infolist() if not zi.is_dir()]
                  if not files or any(zi.file_size != 0 for zi in files):
                      raise RuntimeError(f'{window} is not a zero-byte source diagnostic')
                  no_data_evidence.append({
                      'window': window,
                      'classification': 'source-empty/no market candles',
                      'diagnostic_artifact_id': a['id'],
                      'diagnostic_sha256': digest,
                      'files': [{'name': zi.filename, 'bytes': zi.file_size} for zi in files],
                  })

          # Add the already-verified one-day canary that the recovery matrix skipped.
          canary_artifacts = list_artifacts(canary_run)
          canary_name = 'dukascopy-dxy-ask-json-canary-2022-12-22__2022-12-23'
          canaries = [a for a in canary_artifacts if a['name'] == canary_name and not a.get('expired')]
          if not canaries:
              raise RuntimeError('Missing verified 2022-12-22 ASK canary')
          selected = dict(latest)
          selected['2022-12-22__2022-12-23'] = max(canaries, key=lambda x: x['created_at'])
          if len(selected) != 226:
              raise RuntimeError(f'Expected 226 verified ASK daily blocks including canary, got {len(selected)}')

          root = Path('ask_bundle')
          shutil.rmtree(root, ignore_errors=True)
          (root / 'daily').mkdir(parents=True)
          verified = []

          for i, (window, a) in enumerate(sorted(selected.items()), 1):
              zbytes = request_bytes(a['archive_download_url'])
              artifact_digest = a.get('digest', '')
              if artifact_digest.startswith('sha256:'):
                  actual = hashlib.sha256(zbytes).hexdigest()
                  if actual != artifact_digest.split(':', 1)[1]:
                      raise RuntimeError(f'GitHub artifact digest mismatch: {window}')

              dest = root / 'daily' / window
              dest.mkdir(parents=True)
              with zipfile.ZipFile(io.BytesIO(zbytes)) as zf:
                  zf.extractall(dest)

              parquets = list(dest.rglob('*.parquet'))
              manifests = list(dest.rglob('manifest_*.json'))
              qualities = list(dest.rglob('quality_*.csv'))
              checksums = list(dest.rglob('checksums_*.csv'))
              if not (len(parquets) == len(manifests) == len(qualities) == len(checksums) == 1):
                  raise RuntimeError(f'Incomplete verified payload for {window}')

              with checksums[0].open(newline='', encoding='utf-8') as fh:
                  checksum_row = next(csv.DictReader(fh))
              pq_sha = hashlib.sha256(parquets[0].read_bytes()).hexdigest()
              if pq_sha != checksum_row['sha256']:
                  raise RuntimeError(f'Parquet SHA-256 mismatch for {window}')

              manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
              if manifest.get('target') != 'DXY' or manifest.get('side') != 'ask' or manifest.get('compression') != 'parquet-zstd':
                  raise RuntimeError(f'Manifest mismatch for {window}')

              with qualities[0].open(newline='', encoding='utf-8') as fh:
                  quality = next(csv.DictReader(fh))
              if int(float(quality['rows'])) <= 0 or int(float(quality['duplicates'])) != 0 or int(float(quality['invalid_ohlc'])) != 0:
                  raise RuntimeError(f'Quality failure in packaged artifact for {window}')

              verified.append({
                  'window': window,
                  'rows': int(float(quality['rows'])),
                  'parquet_sha256': pq_sha,
                  'artifact_id': a['id'],
                  'artifact_sha256': artifact_digest,
              })
              if i % 25 == 0 or i == len(selected):
                  print(f'Verified {i}/{len(selected)} ASK blocks', flush=True)

          summary = {
              'instrument': 'DXY_DUKASCOPY',
              'side': 'ask',
              'recovery_range': {'start_inclusive': '2022-08-24', 'end_exclusive': '2023-07-10'},
              'verified_daily_blocks': len(verified),
              'total_rows': sum(x['rows'] for x in verified),
              'expected_source_empty_days': no_data_evidence,
              'validation': [
                  'GitHub artifact SHA-256',
                  'Parquet SHA-256 against per-block checksums',
                  'Parquet Zstandard manifest',
                  'rows > 0',
                  'duplicates = 0',
                  'invalid_ohlc = 0',
              ],
              'blocks': verified,
          }
          (root / 'ASK_RECOVERY_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps({k: summary[k] for k in ['verified_daily_blocks', 'total_rows', 'expected_source_empty_days']}, indent=2))
          PY

      - name: Package final ASK bundle
        run: |
          tar -czf DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz ask_bundle
          sha256sum DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz > DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          cat DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256

      - name: Upload final verified ASK bundle
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-ask-final-bundle
          path: |
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz
            DXY_ASK_recovery_2022-08-24_2023-07-10.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
