name: Dukascopy test

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - 'trading_pipeline/**'
      - '.github/workflows/dukascopy-test.yml'

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Download and validate
        run: python trading_pipeline/test_download.py
      - name: Upload verified test data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-test-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
