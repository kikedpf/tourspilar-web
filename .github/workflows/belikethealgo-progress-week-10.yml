name: BeLikeTheAlgo - update progress after week 10

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-progress-week-10.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch STUDY_PROGRESS
        env:
          REPLACEMENT_B64: ''
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text()
          repl = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          pattern = r'### Week 10 — PROCESSING COMPLETE, ANALYSIS NEXT\n.*?\n### NEXT\n.*?\Z'
          new, n = re.subn(pattern, repl, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one Week 10 tail block, found {n}')
          p.write_text(new)
          PY
      - name: Commit progress update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet || git commit -m 'Mark BeLikeTheAlgo Week 10 complete under v2'
          git push origin HEAD:belikethealgo-course-study
