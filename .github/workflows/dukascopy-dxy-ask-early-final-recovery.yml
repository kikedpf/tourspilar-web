name: Recover unresolved early DXY ASK days

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-ask-early-final-recovery.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dukascopy-dxy-ask-early-final-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Recover unresolved early ASK days
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: '34700992476'
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, re, shutil, subprocess, sys, time, urllib.error, urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; run_id=os.environ['ORIGINAL_RUN_ID']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dxy-ask-early-recovery'}
          transient={429,500,502,503,504}
          def api_json(url):
              delays=[0,2,5,10,20,30,60]
              for n,delay in enumerate(delays,1):
                  if delay: time.sleep(delay)
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=90) as r: return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code not in transient or n==len(delays): raise
                      print(f'GitHub API HTTP {e.code}; retry {n}/{len(delays)}',flush=True)

          jobs=[]; page=1; per=30
          while True:
              batch=api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page={per}&page={page}').get('jobs',[])
              jobs.extend(batch)
              if len(batch)<per: break
              page+=1

          pat=re.compile(r'^ask \((\d{4}-\d{2}-\d{2})__(\d{4}-\d{2}-\d{2})\)$')
          cutoff=date(2022,8,24)
          failed=[]; days=set()
          for j in jobs:
              m=pat.match(j.get('name',''))
              if m and j.get('conclusion')!='success':
                  a,b=m.groups(); failed.append((a,b,j.get('conclusion'),j.get('id')))
                  d=date.fromisoformat(a); end=min(date.fromisoformat(b),cutoff)
                  while d<end:
                      if d.weekday()<5: days.add(d)
                      d+=timedelta(days=1)
          print(f'Original ASK failed windows: {len(failed)}',flush=True)
          print(f'Early ASK weekday days to recover: {len(days)}',flush=True)
          print(f'Early range: {min(days) if days else None} .. {max(days) if days else None}',flush=True)

          root=Path('ask_early_final'); recovered=root/'daily'; logs=root/'logs'
          recovered.mkdir(parents=True,exist_ok=True); logs.mkdir(parents=True,exist_ok=True)
          results={}
          def run_day(d,delays,tag):
              window=f'{d.isoformat()}__{(d+timedelta(days=1)).isoformat()}'
              shutil.rmtree('output',ignore_errors=True)
              env=os.environ.copy(); env.update({'WINDOW':window,'TARGET':'DXY','SIDE':'ask','DOWNLOAD_DELAYS':delays})
              p=subprocess.run([sys.executable,'trading_pipeline/side_download.py'],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (logs/f'{window}.{tag}.log').write_text(p.stdout,encoding='utf-8')
              print(f'{tag} {window}: rc={p.returncode}',flush=True)
              if p.returncode==0:
                  dest=recovered/window; shutil.rmtree(dest,ignore_errors=True); shutil.copytree('output',dest); return 'success'
              raw=list(Path('output/raw').glob('*.csv')) if Path('output/raw').exists() else []
              if 'download failed:' in p.stdout and 'rc=0' in p.stdout and raw and all(f.stat().st_size<=50 for f in raw): return 'source_empty'
              return 'hard_failure'

          hard=[]; source_empty=[]
          for idx,d in enumerate(sorted(days),1):
              status=run_day(d,'0,5,15','pass1'); results[d.isoformat()]=status
              if status=='hard_failure': hard.append(d)
              elif status=='source_empty': source_empty.append(d)
              if idx%20==0 or idx==len(days): print(f'PASS1 {idx}/{len(days)} hard={len(hard)} empty={len(source_empty)}',flush=True)

          second_hard=[]
          for idx,d in enumerate(hard,1):
              status=run_day(d,'0,60,180','pass2'); results[d.isoformat()]=status
              if status=='hard_failure': second_hard.append(d)
              elif status=='source_empty': source_empty.append(d)
              if idx%10==0 or idx==len(hard): print(f'PASS2 {idx}/{len(hard)} remaining_hard={len(second_hard)}',flush=True)

          verified=[]
          for d in sorted(days):
              if results.get(d.isoformat())!='success': continue
              window=f'{d.isoformat()}__{(d+timedelta(days=1)).isoformat()}'; dest=recovered/window
              pqs=list(dest.rglob('*.parquet')); mans=list(dest.rglob('manifest_*.json')); qs=list(dest.rglob('quality_*.csv')); cs=list(dest.rglob('checksums_*.csv'))
              if not (len(pqs)==len(mans)==len(qs)==len(cs)==1): raise RuntimeError(f'Incomplete ASK payload {window}')
              with cs[0].open(newline='',encoding='utf-8') as fh: row=next(csv.DictReader(fh))
              sha=hashlib.sha256(pqs[0].read_bytes()).hexdigest()
              if sha!=row['sha256']: raise RuntimeError(f'Parquet SHA mismatch {window}')
              manifest=json.loads(mans[0].read_text(encoding='utf-8'))
              if manifest.get('target')!='DXY' or manifest.get('side')!='ask' or manifest.get('compression')!='parquet-zstd': raise RuntimeError(f'Manifest mismatch {window}')
              with qs[0].open(newline='',encoding='utf-8') as fh: q=next(csv.DictReader(fh))
              if int(float(q['rows']))<=0 or int(float(q['duplicates']))!=0 or int(float(q['invalid_ohlc']))!=0: raise RuntimeError(f'Quality failure {window}')
              verified.append({'window':window,'rows':int(float(q['rows'])),'parquet_sha256':sha})

          source_empty=sorted(set(source_empty))
          summary={'instrument':'DXY_DUKASCOPY','side':'ask','scope':'original failed ASK weekdays before 2022-08-24','failed_original_windows':len(failed),'weekday_days_attempted':len(days),'verified_daily_blocks':len(verified),'total_rows':sum(x['rows'] for x in verified),'source_empty_days':[f'{d.isoformat()}__{(d+timedelta(days=1)).isoformat()}' for d in source_empty],'hard_failures':[f'{d.isoformat()}__{(d+timedelta(days=1)).isoformat()}' for d in second_hard],'blocks':verified}
          (root/'ASK_EARLY_RECOVERY_SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps({k:summary[k] for k in ('weekday_days_attempted','verified_daily_blocks','total_rows','source_empty_days','hard_failures')},indent=2),flush=True)
          if second_hard: raise SystemExit(f'{len(second_hard)} ASK days still failed')
          PY
      - name: Package verified early ASK recovery
        if: success()
        run: |
          tar -czf DXY_ASK_early_final_recovery.tar.gz ask_early_final
          sha256sum DXY_ASK_early_final_recovery.tar.gz > DXY_ASK_early_final_recovery.tar.gz.sha256
          cat DXY_ASK_early_final_recovery.tar.gz.sha256
      - name: Upload verified early ASK recovery bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-ask-early-final-bundle
          path: |
            DXY_ASK_early_final_recovery.tar.gz
            DXY_ASK_early_final_recovery.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload ASK diagnostics if genuine failures remain
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-ask-early-final-recovery
          path: ask_early_final/
          if-no-files-found: warn
          retention-days: 7
