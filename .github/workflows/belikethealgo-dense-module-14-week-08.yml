name: BeLikeTheAlgo - dense evidence module 14 week 8

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-dense-module-14-week-08.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-week-08:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MEGA reader and visual dependencies
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless pillow
      - name: Download published Week 8 source video only
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '8'
          VIDEO_MAX: '8'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify exactly one Week 8 MP4 was downloaded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('projects/belikethealgo-course-study/work/raw/_download_summary.json').read_text())
          if data.get('count') != 1:
              raise SystemExit(f"Expected exactly one Week 8 MP4, got {data.get('count')}")
          print(data)
          PY
      - name: Extract dense visual evidence
        run: |
          set -euo pipefail
          ROOT='projects/belikethealgo-course-study'
          VIDEO="$(find "$ROOT/work/raw" -type f -iname '*.mp4' | head -1)"
          test -n "$VIDEO"
          OUT="$ROOT/work/dense/week-08"
          mkdir -p "$OUT"
          # Full chart-review body at 1 fps.
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/baseline-1fps" \
            --fps 1 --interval 220:1000 --interval 1000:1800 --interval 1800:2600 --interval 2600:3300 --interval 3300:3900
          # 2 fps around trade/no-trade decisions, drawings and management identified in the semantic-map pass.
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/focus-2fps" \
            --fps 2 --interval 280:780 --interval 1300:2030 --interval 2120:2890 --interval 2960:3500 --interval 3650:3900
          rm -rf "$OUT/baseline-1fps/frames" "$OUT/focus-2fps/frames"
      - name: Write evidence manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('projects/belikethealgo-course-study/work/dense/week-08')
          manifest={'week':8,'protocol':'ANALYSIS_PROTOCOL.md + measurement_architecture_v2 + weekly_trade_event_schema_v2','baseline':json.loads((root/'baseline-1fps'/'dense_index.json').read_text()),'focus':json.loads((root/'focus-2fps'/'dense_index.json').read_text()),'note':'Dense frames consolidated into timestamped contact sheets after extraction.'}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('baseline frames:',manifest['baseline']['frame_count']); print('focus frames:',manifest['focus']['frame_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-008-dense-evidence-v2
          path: projects/belikethealgo-course-study/work/dense/week-08
          if-no-files-found: error
          retention-days: 2
