name: Dukascopy DXY targeted recovery

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-recovery.yml'

concurrency:
  group: dukascopy-dxy-targeted-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - side: ask
            window: 2022-10-13__2022-10-23
          - side: ask
            window: 2022-10-23__2022-11-02
          - side: ask
            window: 2022-11-02__2022-11-12
          - side: ask
            window: 2022-11-12__2022-11-22
          - side: ask
            window: 2022-11-22__2022-12-02
          - side: ask
            window: 2022-12-02__2022-12-12
          - side: ask
            window: 2022-12-12__2022-12-22
          - side: ask
            window: 2022-12-22__2023-01-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Cooldown before recovery
        run: sleep 60
      - name: Download and validate DXY recovery block
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: ${{ matrix.side }}
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY recovery block
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-${{ matrix.side }}-recovery-${{ matrix.window }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-${{ matrix.side }}-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

# Targeted recovery batch 2: these ASK blocks failed under repeated Dukascopy HTTP 429.
# Jobs are intentionally serialized. The shared downloader uses four sparse attempts
# (0/180/600/1200s for DXY) and still enforces Parquet Zstandard, SHA-256,
# numeric round-trip integrity, duplicate checks, and strict OHLC validation.
