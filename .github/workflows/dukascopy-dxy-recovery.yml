name: Dukascopy DXY targeted recovery

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-recovery.yml'

concurrency:
  group: dukascopy-dxy-targeted-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Minimal JSON-API canary: one completed trading day = one minute-data
          # bucket/request in current dukascopy-node. This isolates whether the
          # previous 10-day DXY ASK failures were caused by request pressure.
          - side: ask
            window: 2022-12-22__2022-12-23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Download and validate one-day DXY ASK canary
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: ${{ matrix.side }}
          DOWNLOAD_DELAYS: '0,60,180'
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY canary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-${{ matrix.side }}-json-canary-${{ matrix.window }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload canary diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-${{ matrix.side }}-json-canary-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

# DXY recovery uses the current Jetta JSON data API through dukascopy-node 1.50.0.
# The legacy 1.46.4 canary failed against the obsolete datafeed path. Recovery
# starts with one completed day so M1 requires only one JSON day bucket. Verified
# outputs still pass Parquet Zstandard, SHA-256, numeric round-trip, duplicate and
# OHLC validation in trading_pipeline/side_download.py before artifact upload.
