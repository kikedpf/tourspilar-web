name: Dukascopy DXY targeted recovery

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-recovery.yml'

concurrency:
  group: dukascopy-dxy-targeted-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Canary: this exact block failed four times with HTTP 429 under
          # dukascopy-node 1.50.0. Test the pre-JSON-engine release first
          # before retrying the remaining historical ASK gaps.
          - side: ask
            window: 2022-12-22__2023-01-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.46.4
      - name: Cooldown before recovery
        run: sleep 60
      - name: Download and validate DXY recovery block
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: ${{ matrix.side }}
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY recovery block
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-${{ matrix.side }}-legacy-canary-${{ matrix.window }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-${{ matrix.side }}-legacy-canary-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

# Legacy-engine canary recovery. dukascopy-node 1.49.0 rewrote the engine around
# a JSON API; repeated DXY ASK 2022 pulls on 1.50.0 are receiving HTTP 429 even
# after 180/600/1200 second backoff. This isolates one known-failing block on
# 1.46.4 before expanding the retry set. Validation remains in side_download.py:
# Parquet Zstandard, SHA-256, numeric round-trip integrity, duplicate and OHLC checks.
