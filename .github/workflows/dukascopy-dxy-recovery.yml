name: Dukascopy DXY targeted recovery

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-recovery.yml'
  workflow_dispatch:

concurrency:
  group: dukascopy-dxy-targeted-recovery
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      count: ${{ steps.generate.outputs.count }}
    steps:
      - id: generate
        name: Build resumable one-day BID recovery matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta

          start = date(2024, 3, 5)
          end = date(2024, 3, 6)  # exclusive; sole unresolved BID day
          already_verified = set()

          include = []
          d = start
          while d < end:
              # FX weekend closures are intentionally not scheduled. Weekday
              # exchange holidays, if any, will be surfaced explicitly as
              # diagnostics rather than silently treated as market data.
              if d.weekday() < 5 and d not in already_verified:
                  include.append({
                      "side": "bid",
                      "window": f"{d.isoformat()}__{(d + timedelta(days=1)).isoformat()}",
                  })
              d += timedelta(days=1)

          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
              fh.write(f"count={len(include)}\n")
          print(f"Prepared {len(include)} one-day recovery jobs")
          PY

  recover:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0
      - name: Download and validate one-day DXY BID recovery block
        env:
          WINDOW: ${{ matrix.window }}
          TARGET: DXY
          SIDE: ${{ matrix.side }}
          DOWNLOAD_DELAYS: '0,60,180'
        run: python trading_pipeline/side_download.py
      - name: Upload verified DXY daily block
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-${{ matrix.side }}-daily-${{ matrix.window }}
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Upload recovery diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-${{ matrix.side }}-daily-${{ matrix.window }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

# Final targeted BID recovery for the sole genuine hard failure from the original
# five-year inventory. Keep one weekday per job, dukascopy-node 1.50.0,
# max-parallel=1, Parquet Zstandard, SHA-256, numeric round-trip, duplicate
# and OHLC validation. Diagnostics are never accepted as valid data.
