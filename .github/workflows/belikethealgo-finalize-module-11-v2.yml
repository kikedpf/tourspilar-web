name: BeLikeTheAlgo - finalize module 11 progress v2

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-finalize-module-11-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Update study progress safely
        env:
          TAIL_B64: ''
        run: |
          python -c "import os,base64; from pathlib import Path; p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md'); s=p.read_text(encoding='utf-8'); marker='## 11) Confirmaciones de Entrada a un Trade'; assert marker in s; head=s.split(marker,1)[0].rstrip(); tail=base64.b64decode(os.environ['TAIL_B64']).decode('utf-8'); p.write_text(head+'\n\n'+tail,encoding='utf-8')"
      - name: Commit progress update
        run: |
          git config user.name "kikedpf"
          git config user.email "kipolan12@hotmail.es"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete BeLikeTheAlgo module 11 entry confirmations"
          git push origin HEAD:belikethealgo-course-study
