name: BeLikeTheAlgo - dense evidence module 14 week 15

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-dense-module-14-week-15.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dense-week-15:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Record Week 14 v2 completion in study progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s=p.read_text()
          if '### Week 14 — COMPLETE (v2)' not in s:
              marker='### NEXT\n'
              block='''### Week 14 — COMPLETE (v2)\n- Full ~59m03s video reviewed chronologically with 610 timestamped transcript segments plus dense full-video visual evidence.\n- Dense evidence gate: 3,543 baseline frames at 1 fps + 7,086 focus frames at 2 fps before contact-sheet consolidation.\n- Monday is strong negative evidence: visually attractive liquidity/POI reactions remain no-trades when the day/session is blocked by major London/NY news in an FOMC week; later successful movement does not create a hindsight exception.\n- Tuesday and Friday keep multiple 1m–5m imbalance/confirmation choices in L2; exact deeper fills cannot be hindsight-selected, and scaled/re-entry tickets from one move remain one correlated `same_underlying_move_group`.\n- Wednesday shows that downstream LTF structure/imbalance cannot repair a failed L0 HTF-location gate: if the required HTF zone was not touched, Benjamin says not to enter even when the later pattern looks perfect.\n- Thursday separates valid losing setups from rule violations and shows that a large news-driven displacement outside valid time is not automatically a valid L1 impulse/activation.\n- Benjamin's claim that first London / second New York outperform second London is retained only as an instructor probability hypothesis; he still trades second London, so no detector threshold is selected from P&L.\n- Friday's fear-driven manual BE exit and same-move re-entry are stored as L2 management/process events; the later favorable path is L3 and cannot justify the original entry.\n- Exact OHLC/ATR, spread/slippage, realized R and broker-specific sub-pip outcomes remain unresolved rather than guessed.\n- Detailed v2 record: `study/14-trades-semanales-explicados/014-semana-14.md`.\n\n'''
              if marker not in s:
                  raise SystemExit('NEXT marker not found')
              s=s.replace(marker,block+marker,1)
          s=s.replace('- Process and study the next available published weekly item beginning with Week 14, strictly one week at a time after evidence generation.', '- Process and study the next available published weekly item beginning with Week 15, strictly one week at a time after evidence generation.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record BeLikeTheAlgo week 14 v2 completion'
            git push origin HEAD:belikethealgo-course-study
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MEGA reader and visual dependencies
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless pillow
      - name: Download published Week 15 source video only
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '15'
          VIDEO_MAX: '15'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify exactly one Week 15 MP4 was downloaded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('projects/belikethealgo-course-study/work/raw/_download_summary.json').read_text())
          if data.get('count') != 1:
              raise SystemExit(f"Expected exactly one Week 15 MP4, got {data.get('count')}")
          print(data)
          PY
      - name: Extract dense visual evidence
        run: |
          set -euo pipefail
          ROOT='projects/belikethealgo-course-study'
          VIDEO="$(find "$ROOT/work/raw" -type f -iname '*.mp4' | head -1)"
          test -n "$VIDEO"
          OUT="$ROOT/work/dense/week-15"
          mkdir -p "$OUT"
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/baseline-1fps" --fps 1 --interval 0:7200
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/focus-2fps" --fps 2 --interval 0:7200
          rm -rf "$OUT/baseline-1fps/frames" "$OUT/focus-2fps/frames"
      - name: Write evidence manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('projects/belikethealgo-course-study/work/dense/week-15')
          manifest={
            'week':15,
            'protocol':'ANALYSIS_PROTOCOL.md + measurement_architecture_v2 + weekly_trade_event_schema_v2',
            'baseline':json.loads((root/'baseline-1fps'/'dense_index.json').read_text()),
            'focus':json.loads((root/'focus-2fps'/'dense_index.json').read_text()),
            'note':'Full-video dense passes consolidated into timestamped contact sheets after extraction.'
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('baseline frames:',manifest['baseline']['frame_count'])
          print('focus frames:',manifest['focus']['frame_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-015-dense-evidence-v2
          path: projects/belikethealgo-course-study/work/dense/week-15
          if-no-files-found: error
          retention-days: 2

# explicit trigger commit after workflow registration
