name: Recover unresolved DXY BID days

on:
  push:
    branches: [trading-data-pipeline]
    paths:
      - '.github/workflows/dukascopy-dxy-bid-final-recovery.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dukascopy-dxy-bid-final-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          npm install -g dukascopy-node@1.50.0

      - name: Recover only unresolved BID days from original run
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: '34700992476'
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess, sys, time, urllib.error, urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_id = os.environ['ORIGINAL_RUN_ID']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'dxy-bid-final-recovery',
          }
          transient = {429, 500, 502, 503, 504}

          def api_json(url):
              delays = [0, 2, 5, 10, 20, 30, 60]
              last = None
              for n, delay in enumerate(delays, 1):
                  if delay:
                      time.sleep(delay)
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code not in transient or n == len(delays):
                          raise
                      print(f'GitHub API HTTP {e.code}; retry {n}/{len(delays)}: {url}', flush=True)
                  except urllib.error.URLError as e:
                      last = e
                      if n == len(delays):
                          raise
                      print(f'GitHub API URL error; retry {n}/{len(delays)}: {e}', flush=True)
              raise last

          jobs = []
          page = 1
          per_page = 30
          while True:
              data = api_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page={per_page}&page={page}')
              batch = data.get('jobs', [])
              jobs.extend(batch)
              print(f'GitHub jobs page {page}: {len(batch)} (total {len(jobs)})', flush=True)
              if len(batch) < per_page:
                  break
              page += 1

          pat = re.compile(r'^bid \((\d{4}-\d{2}-\d{2})__(\d{4}-\d{2}-\d{2})\)$')
          failed_windows = []
          for j in jobs:
              m = pat.match(j.get('name', ''))
              if m and j.get('conclusion') != 'success':
                  failed_windows.append((m.group(1), m.group(2), j.get('conclusion'), j.get('id')))

          if not failed_windows:
              print('No unresolved BID windows in original run.')
              Path('bid_final').mkdir()
              Path('bid_final/BID_RECOVERY_SUMMARY.json').write_text(json.dumps({
                  'instrument': 'DXY_DUKASCOPY', 'side': 'bid', 'unresolved_original_windows': 0,
                  'verified_daily_blocks': 0, 'source_empty_days': [], 'hard_failures': []
              }, indent=2), encoding='utf-8')
              sys.exit(0)

          days = set()
          for start_s, end_s, conclusion, job_id in failed_windows:
              d = date.fromisoformat(start_s)
              end = date.fromisoformat(end_s)
              while d < end:
                  if d.weekday() < 5:
                      days.add(d)
                  d += timedelta(days=1)

          print(f'Original BID jobs inspected: {len(jobs)}')
          print(f'Unresolved BID windows: {len(failed_windows)}')
          print(f'Unique weekday BID days to recover: {len(days)}')
          for x in failed_windows:
              print('UNRESOLVED_WINDOW', x)

          root = Path('bid_final')
          recovered = root / 'daily'
          logs = root / 'logs'
          recovered.mkdir(parents=True, exist_ok=True)
          logs.mkdir(parents=True, exist_ok=True)
          results = {}

          def run_day(d, delays, tag):
              next_d = d + timedelta(days=1)
              window = f'{d.isoformat()}__{next_d.isoformat()}'
              shutil.rmtree('output', ignore_errors=True)
              env = os.environ.copy()
              env.update({
                  'WINDOW': window,
                  'TARGET': 'DXY',
                  'SIDE': 'bid',
                  'DOWNLOAD_DELAYS': delays,
              })
              p = subprocess.run(
                  [sys.executable, 'trading_pipeline/side_download.py'],
                  env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              (logs / f'{window}.{tag}.log').write_text(p.stdout, encoding='utf-8')
              print(f'{tag} {window}: rc={p.returncode}', flush=True)
              if p.returncode == 0:
                  dest = recovered / window
                  shutil.rmtree(dest, ignore_errors=True)
                  shutil.copytree('output', dest)
                  return 'success'

              raw = list(Path('output/raw').glob('*.csv')) if Path('output/raw').exists() else []
              source_empty = (
                  'download failed:' in p.stdout and 'rc=0' in p.stdout and raw and
                  all(f.stat().st_size <= 50 for f in raw)
              )
              if source_empty:
                  return 'source_empty'
              return 'hard_failure'

          hard = []
          source_empty = []
          for idx, d in enumerate(sorted(days), 1):
              status = run_day(d, '0,5,15', 'pass1')
              results[d.isoformat()] = status
              if status == 'hard_failure':
                  hard.append(d)
              elif status == 'source_empty':
                  source_empty.append(d)
              if idx % 20 == 0 or idx == len(days):
                  print(f'PASS1 progress {idx}/{len(days)}; hard={len(hard)} empty={len(source_empty)}', flush=True)

          second_hard = []
          for idx, d in enumerate(hard, 1):
              status = run_day(d, '0,60,180', 'pass2')
              results[d.isoformat()] = status
              if status == 'hard_failure':
                  second_hard.append(d)
              elif status == 'source_empty':
                  source_empty.append(d)
              if idx % 10 == 0 or idx == len(hard):
                  print(f'PASS2 progress {idx}/{len(hard)}; remaining hard={len(second_hard)}', flush=True)

          source_empty = sorted(set(source_empty))
          verified = []
          for d in sorted(days):
              if results.get(d.isoformat()) != 'success':
                  continue
              window = f'{d.isoformat()}__{(d + timedelta(days=1)).isoformat()}'
              dest = recovered / window
              pq = list(dest.rglob('*.parquet'))
              manifest = list(dest.rglob('manifest_*.json'))
              quality = list(dest.rglob('quality_*.csv'))
              checksums = list(dest.rglob('checksums_*.csv'))
              if not (len(pq) == len(manifest) == len(quality) == len(checksums) == 1):
                  raise RuntimeError(f'Incomplete supposedly verified BID payload: {window}')
              verified.append(window)

          summary = {
              'instrument': 'DXY_DUKASCOPY',
              'side': 'bid',
              'source_run_id': int(run_id),
              'unresolved_original_windows': [
                  {'window': f'{a}__{b}', 'conclusion': c, 'job_id': jid}
                  for a, b, c, jid in failed_windows
              ],
              'weekday_days_attempted': len(days),
              'verified_daily_blocks': len(verified),
              'source_empty_days': [
                  f'{d.isoformat()}__{(d + timedelta(days=1)).isoformat()}' for d in source_empty
              ],
              'hard_failures': [
                  f'{d.isoformat()}__{(d + timedelta(days=1)).isoformat()}' for d in second_hard
              ],
              'validation': 'Each verified block passed side_download.py: Parquet Zstandard, SHA-256, numeric round-trip, duplicates=0 and valid OHLC.',
          }
          (root / 'BID_RECOVERY_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))

          if second_hard:
              raise SystemExit(f'{len(second_hard)} BID days still have genuine download failures after slow retry')
          PY

      - name: Package verified BID recovery
        if: success()
        run: |
          tar -czf DXY_BID_final_recovery.tar.gz bid_final
          sha256sum DXY_BID_final_recovery.tar.gz > DXY_BID_final_recovery.tar.gz.sha256
          cat DXY_BID_final_recovery.tar.gz.sha256

      - name: Upload verified BID recovery bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-dxy-bid-final-bundle
          path: |
            DXY_BID_final_recovery.tar.gz
            DXY_BID_final_recovery.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload BID diagnostics if genuine failures remain
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-dxy-bid-final-recovery
          path: bid_final/
          if-no-files-found: warn
          retention-days: 7
