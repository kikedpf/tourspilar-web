name: BeLikeTheAlgo - dense evidence module 14 week 13

on:
  push:
    branches: [belikethealgo-course-study]
    paths: ['.github/workflows/belikethealgo-dense-module-14-week-13.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dense-week-13:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Record Week 12 v2 completion in study progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s=p.read_text()
          if '### Week 12 — COMPLETE (v2)' not in s:
              marker='### NEXT\n'
              block='''### Week 12 — COMPLETE (v2)\n- Full ~85m42s video reviewed chronologically with ~749 timestamped transcript segments/lines plus dense full-video visual evidence.\n- Dense evidence gate (manifest-audited): 5,142 baseline frames at 1 fps + 10,284 focus frames at 2 fps before contact-sheet consolidation. Earlier 3,426/6,851 reporting was corrected from the actual manifest.\n- Monday supplies explicit anti-overfitting evidence: recognizable/ultimately profitable LTF geometry remains plan-ineligible when required PWH/timing conditions are absent.\n- Monday/Tuesday/Friday reinforce `reaction != decisive impulse != later displacement`; the imbalance-producing force is stored separately from the broader subsequent leg.\n- Tuesday observed management ends at BE although the later chart would have reached TP without BE; that counterfactual is L3 only and cannot retrospectively tune management.\n- Wednesday shows nearby weekly external liquidity can dominate stale lower-timeframe reversal zones; target proximity, freshness and approach quality are pre-entry variables.\n- Thursday contains a Benjamin-personal immediate-break execution explicitly not recommended to students; it is isolated as an instructor-discretionary exception rather than promoted into the replication baseline.\n- Benjamin's claimed high-performing London subwindow is retained as a hypothesis only; no detector cutoff is selected from P&L clustering.\n- Friday makes the hierarchy explicit: meaningful maxima/minima/liquidity are primary; imbalance is secondary confluence whose relevance rises when linked to available liquidity.\n- Scaled entries remain grouped by `same_underlying_move_group`; spread/slippage/fill precision and unresolved thresholds are not guessed.\n- Detailed v2 record: `study/14-trades-semanales-explicados/012-semana-12.md`.\n\n'''
              if marker not in s:
                  raise SystemExit('NEXT marker not found')
              s=s.replace(marker,block+marker,1)
          s=s.replace('- Process and study the next available published weekly item beginning with Week 12, strictly one week at a time after evidence generation.', '- Process and study the next available published weekly item beginning with Week 13, strictly one week at a time after evidence generation.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record BeLikeTheAlgo week 12 v2 completion'
            git push origin HEAD:belikethealgo-course-study
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MEGA reader and visual dependencies
        run: |
          cd projects/belikethealgo-course-study
          npm init -y >/dev/null 2>&1
          npm install --no-save megajs@1.3.10
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless pillow
      - name: Download published Week 13 source video only
        env:
          MEGA_PUBLIC_LINK: 'https://mega.nz/folder/QvEXiZpB#dFIeSfaKPvzSLnOEmzleTg'
          MODULES: '14'
          VIDEO_MIN: '13'
          VIDEO_MAX: '13'
        run: node projects/belikethealgo-course-study/scripts/mega_download_modules.mjs
      - name: Verify exactly one Week 13 MP4 was downloaded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('projects/belikethealgo-course-study/work/raw/_download_summary.json').read_text())
          if data.get('count') != 1:
              raise SystemExit(f"Expected exactly one Week 13 MP4, got {data.get('count')}")
          print(data)
          PY
      - name: Extract dense visual evidence
        run: |
          set -euo pipefail
          ROOT='projects/belikethealgo-course-study'
          VIDEO="$(find "$ROOT/work/raw" -type f -iname '*.mp4' | head -1)"
          test -n "$VIDEO"
          OUT="$ROOT/work/dense/week-13"
          mkdir -p "$OUT"
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/baseline-1fps" --fps 1 --interval 0:7200
          python "$ROOT/scripts/dense_extract.py" "$VIDEO" "$OUT/focus-2fps" --fps 2 --interval 0:7200
          rm -rf "$OUT/baseline-1fps/frames" "$OUT/focus-2fps/frames"
      - name: Write evidence manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('projects/belikethealgo-course-study/work/dense/week-13')
          manifest={
            'week':13,
            'protocol':'ANALYSIS_PROTOCOL.md + measurement_architecture_v2 + weekly_trade_event_schema_v2',
            'baseline':json.loads((root/'baseline-1fps'/'dense_index.json').read_text()),
            'focus':json.loads((root/'focus-2fps'/'dense_index.json').read_text()),
            'note':'Full-video dense passes consolidated into timestamped contact sheets after extraction.'
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('baseline frames:',manifest['baseline']['frame_count'])
          print('focus frames:',manifest['focus']['frame_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: belikethealgo-module-14-week-013-dense-evidence-v2
          path: projects/belikethealgo-course-study/work/dense/week-13
          if-no-files-found: error
          retention-days: 2

# registered; next commit to this file is the explicit trigger
