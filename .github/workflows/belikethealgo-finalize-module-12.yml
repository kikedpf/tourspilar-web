name: BeLikeTheAlgo - finalize module 12 progress

on:
  push:
    branches:
      - belikethealgo-course-study
    paths:
      - '.github/workflows/belikethealgo-finalize-module-12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      TAIL_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belikethealgo-course-study
      - name: Update study progress
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('projects/belikethealgo-course-study/STUDY_PROGRESS.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 12) Trading Plan — NEXT'
          if marker not in s:
              raise SystemExit('Module 12 NEXT marker not found')
          head = s.split(marker, 1)[0].rstrip()
          tail = base64.b64decode(os.environ['TAIL_B64']).decode('utf-8')
          p.write_text(head + '\n\n' + tail, encoding='utf-8')
          PY
      - name: Commit progress update
        run: |
          git config user.name "kikedpf"
          git config user.email "kipolan12@hotmail.es"
          git add projects/belikethealgo-course-study/STUDY_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Complete BeLikeTheAlgo module 12 Trading Plan"
          git push origin HEAD:belikethealgo-course-study
